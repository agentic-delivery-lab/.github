name: Validate public organization governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate public organization governance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out the trusted revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate public surfaces
        run: node scripts/validate-governance.mjs
